<svg xmlns="http://www.w3.org/2000/svg" style="display:none;">
  <symbol id="sheet-metal-mfg" viewBox="0 0 24 24" fill="none">
    <!-- Sheet metal plate -->
    <rect x="2.5" y="10.5" width="19" height="9.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <!-- Bend line -->
    <line x1="2.5" y1="15.2" x2="21.5" y2="15.2" stroke="currentColor" stroke-width="1.3" stroke-dasharray="1.6,1.3"/>
    <!-- Top folded flange -->
    <path d="M2.5 10.5 Q2.5 4 8 4 L16 4 Q21.5 4 21.5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Punch holes -->
    <circle cx="7.5" cy="17.3" r="1.4" stroke="currentColor" stroke-width="1.1"/>
    <circle cx="12" cy="17.3" r="1.4" stroke="currentColor" stroke-width="1.1"/>
    <circle cx="16.5" cy="17.3" r="1.4" stroke="currentColor" stroke-width="1.1"/>
  </symbol>
</svg>
